name: IFIX Mobile VPN – Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  LIBV2RAY_URL: "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.28/libv2ray.aar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Download libv2ray.aar (Xray core)
        run: |
          mkdir -p app/libs
          echo "Downloading ${LIBV2RAY_URL}"
          curl -fL --retry 3 --retry-delay 5 -o app/libs/libv2ray.aar "${LIBV2RAY_URL}"
          ls -lh app/libs/libv2ray.aar
          SIZE=$(stat -c%s app/libs/libv2ray.aar)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: libv2ray.aar too small ($SIZE bytes) – download failed"
            exit 1
          fi
          echo "libv2ray.aar OK ($SIZE bytes)"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IFIXMOBILE_VPN_Debug_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
